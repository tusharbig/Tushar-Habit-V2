function renderJournal(main){let k=key(selectedDate);main.innerHTML=`<h1 class="pagehead">Journal</h1><p class="settings-intro">A quiet place to notice how you’re doing.</p><div class="journal-date">${new Date(k+'T12:00:00').toLocaleDateString('en',{weekday:'long',month:'long',day:'numeric'})}</div><textarea class="field journal-field" id="journalnote" placeholder="What went well today? What would you like to remember?">${esc(store.journal[k]||'')}</textarea><div class="journal-actions"><span id="savednote">${store.journal[k]?'Saved on this device':'Only you can see these notes'}</span><button class="primary-btn" id="savenote">Save note</button></div><div class="about-note">Your journal stays on this device and is included in your backup.</div>`;document.getElementById('savenote').onclick=()=>{store.journal[k]=document.getElementById('journalnote').value.trim();save();document.getElementById('savednote').textContent='Saved just now';toast('Journal note saved')};document.getElementById('journalnote').oninput=()=>{document.getElementById('savednote').textContent='Unsaved changes'}}
